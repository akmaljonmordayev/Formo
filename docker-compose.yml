# Butun loyiha bitta buyruq bilan:  docker compose up --build
#   Frontend:  http://localhost:5173
#   Backend:   http://localhost:3001/api   (Swagger: /api/docs)
#   Postgres:  localhost:5435  (formo / formo)
# .env shart emas — quyidagi qiymatlar dev uchun yetarli. O'zgartirish uchun
# ildizda .env yarating (masalan SUPERADMIN_PASSWORD=...).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: formo
      POSTGRES_PASSWORD: formo
      POSTGRES_DB: formo
    ports:
      - '127.0.0.1:${FORMO_DB_PORT:-5435}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U formo -d formo']
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3001
      NODE_ENV: development
      DATABASE_URL: postgresql://formo:formo@postgres:5432/formo?schema=public
      # `docker compose exec backend pnpm test:e2e` — testlar alohida bazada yuradi
      TEST_DATABASE_URL: postgresql://formo:formo@postgres:5432/formo_test?schema=public
      # Web panel + Expo web (mobil ilovaning brauzer versiyasi)
      FRONTEND_URL: http://localhost:5173,http://localhost:8081,http://localhost:19006
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-formo-dev-only-secret-change-in-production}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      SUPERADMIN_PHONE: ${SUPERADMIN_PHONE:-+998901111111}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-admin123}
      SUPERADMIN_NAME: ${SUPERADMIN_NAME:-Super Admin}
      # Telegram bot (telegram-bot/README.md). Qiymatlar ildizdagi .env dan; bo'sh bo'lsa
      # Telegram orqali kirish 503 qaytaradi, qolgan hamma narsa odatdagidek ishlaydi.
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_INTERNAL_TOKEN: ${TELEGRAM_INTERNAL_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    ports:
      # 0.0.0.0 — telefondagi Expo ilova Wi-Fi orqali ulana olishi uchun.
      # Faqat shu kompyuterdan ochiq qolsin desangiz: FORMO_API_HOST=127.0.0.1
      - '${FORMO_API_HOST:-0.0.0.0}:${FORMO_API_PORT:-3001}:3001'
    volumes:
      # Kod o'zgarsa server avtomatik qayta ishga tushadi
      - ./backend/src:/app/backend/src
      - ./backend/prisma:/app/backend/prisma
      - ./backend/test:/app/backend/test

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: dev
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: ''
      VITE_USE_MOCK_AUTH: 'false'
      # Vite proxy /api ni backend konteyneriga yuboradi
      VITE_PROXY_TARGET: http://backend:3001
    ports:
      - '127.0.0.1:${FORMO_WEB_PORT:-5173}:5173'
    volumes:
      - ./frontend/src:/app/frontend/src
      - ./frontend/public:/app/frontend/public
      - ./frontend/index.html:/app/frontend/index.html
      - ./frontend/vite.config.js:/app/frontend/vite.config.js

  # Ixtiyoriy: docker compose --profile bot up --build
  # Ildizdagi .env da TELEGRAM_BOT_TOKEN va TELEGRAM_INTERNAL_TOKEN bo'lishi shart (polling — ochiq URL kerak emas)
  telegram-bot:
    profiles: ['bot']
    build:
      context: ./telegram-bot
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_INTERNAL_TOKEN: ${TELEGRAM_INTERNAL_TOKEN:-}
      BACKEND_URL: http://backend:3001/api
      BOT_MODE: polling
      PORT: 8080

volumes:
  pgdata:
    name: formo_pgdata
