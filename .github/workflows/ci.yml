name: CI

# Har bir PR va main'ga push'da: lint, typecheck, unit + e2e testlar, production Docker image'lar.
# Deployni Railway o'zi qiladi: servislar shu reponing main branchiga ulangan va
# "Wait for CI" yoqilgan — shu workflow main'da yashil bo'lgandagina yangi versiya chiqadi.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # main'dagi ishni bekor qilmaymiz — Railway shu natijani kutadi
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  NODE_VERSION: 20
  # Usiz pnpm --filter ni e'tiborsiz qoldirib butun monoreponi (mobil ilova bilan) o'rnatadi
  PNPM_INSTALL: pnpm install --frozen-lockfile --config.dedupe-peer-dependents=false

jobs:
  backend:
    name: Backend · lint, test, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: formo
          POSTGRES_PASSWORD: formo
          POSTGRES_DB: formo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U formo -d formo_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://formo:formo@localhost:5432/formo_test?schema=public
      MIGRATIONS_DATABASE_URL: postgresql://formo:formo@localhost:5432/formo_migrations?schema=public
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install
        run: $PNPM_INSTALL --filter @formo/backend
      - name: Prisma generate
        run: pnpm prisma generate
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test:cov
      - name: Migrations apply cleanly and match schema.prisma
        env:
          DATABASE_URL: ${{ env.MIGRATIONS_DATABASE_URL }}
        run: |
          pnpm prisma migrate deploy
          if ! pnpm prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code; then
            echo "::error file=backend/prisma/schema.prisma::schema.prisma o'zgargan, lekin migratsiya yo'q. Lokalda: cd backend && pnpm prisma migrate dev --name <nom>, so'ng prisma/migrations ni commit qiling."
            exit 1
          fi
      - name: E2E tests
        run: pnpm test:e2e
      - name: Build
        run: pnpm build

  frontend:
    name: Frontend · lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install
        run: $PNPM_INSTALL --filter @formo/frontend
      - name: Lint
        run: pnpm lint
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build

  docker:
    name: Docker · production images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: formo
          POSTGRES_PASSWORD: formo
          POSTGRES_DB: formo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U formo -d formo"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          load: true
          tags: formo-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          load: true
          tags: formo-frontend:ci
          build-args: |
            VITE_API_URL=http://localhost:3001
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
      # Railway'da bo'ladigan narsaning o'zi: production rejimida ko'tarilib, migratsiya
      # qo'llanishi va healthcheck 200 qaytarishi kerak
      - name: Smoke test
        run: |
          docker run -d --name api --network host \
            -e PORT=3001 \
            -e DATABASE_URL='postgresql://formo:formo@localhost:5432/formo?schema=public' \
            -e JWT_ACCESS_SECRET="$(openssl rand -hex 32)" \
            -e SUPERADMIN_PHONE=+998901111111 \
            -e SUPERADMIN_PASSWORD="$(openssl rand -hex 12)" \
            -e FRONTEND_URL=http://localhost:8080 \
            formo-backend:ci
          docker run -d --name web --network host -e PORT=8080 formo-frontend:ci

          wait_for() {
            for _ in $(seq 1 30); do
              if curl -fsS "$1" >/dev/null 2>&1; then echo "OK  $1"; return 0; fi
              sleep 2
            done
            echo "::error::$1 javob bermadi"; return 1
          }
          wait_for http://localhost:3001/api/health
          wait_for http://localhost:8080/healthz
          # SPA: ichki manzil ham index.html qaytaradi
          curl -fsS http://localhost:8080/operator/orders | grep -q '<div id="root">'
      - name: Container logs
        if: failure()
        run: |
          docker logs api || true
          docker logs web || true
